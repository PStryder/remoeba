[project]
name = "remoeba"
version = "0.0.1"
description = "Amoeba's persistent cognitive harness, driven by remote OpenAI-format model APIs."
requires-python = ">=3.11,<3.13"
# The foundation carried over from Amoeba is stdlib-only. The remote inference
# client will add its HTTP dependency when it exists, not before.
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-timeout==2.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remoeba"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
filterwarnings = ["error::DeprecationWarning:remoeba.*"]
